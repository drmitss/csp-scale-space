[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-scalespace"
version = "0.1.0"
description = "Anisotropic spectral scale-space formulation for multiscale nonlinear ODEs via Computational Singular Perturbation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dimitris M. Manias" }, { name = "Laurent Najman" }]
keywords = ["computational singular perturbation", "scale-space", "multiscale", "model reduction", "slow invariant manifold"]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5", "sympy>=1.10", "pyyaml>=5.4"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx>=7", "myst-parser", "furo", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/drmitss/csp-scale-space" 
Documentation = "https://github.com/drmitss/csp-scale-space/tree/main/docs"
Issues = "https://github.com/drmitss/csp-scale-space/issues"

[project.scripts]
csp-scalespace = "csp_scalespace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csp_scalespace = ["models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
