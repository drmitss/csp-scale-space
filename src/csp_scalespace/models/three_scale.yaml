# Three-scale reaction network (paper Section 6.2, Eqs. 102-103).
name: three_scale
description: "3D three-timescale network: sequential exhaustion of two fast modes (2D SIM, then 1D SIM)."

definitions:
  R1: "(y1*y2 - y3)/eps1"          # ultra-fast reversible binding
  R2: "(y1/(1 + y1) - y2)/eps2"    # intermediate catalytic conversion

equations:
  y1: "-0.4*R1 - R2 - 0.5*y1"
  y2: "-0.6*R1 + R2 - 0.2*y2**2"
  y3: "R1 - 0.1*y3"

parameters:
  eps1: 1.0e-3
  eps2: 5.0e-2

initial_conditions:
  y1: 1.0
  y2: 0.78
  y3: 0.18

labels:
  y1: "$y^1$"
  y2: "$y^2$"
  y3: "$y^3$"

settings:
  t_end: 20.0
  t_start: 1.0e-5
  time_scale: log
  n_points: 700
  time_unit: s
  order: 0
  levels: [1, 2]
  fiber_filter: rational
  sigma_range: [1.0e-5, 20.0]
  snapshots: [0.0]
  phase_variables: [y1, y2, y3]
